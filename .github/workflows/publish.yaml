name: "Publish"
on:
  # Home Assistant reads sure/config.yaml straight from the default branch, so
  # merging a version bump advertises the update immediately. Build on the same
  # push rather than waiting for the release event, which a GITHUB_TOKEN-created
  # release does not fire -- otherwise users can be offered a version whose
  # image was never pushed.
  push:
    branches:
      - main
    paths:
      - "sure/**"
  release:
    types: [published]
  workflow_dispatch: # Allows manual triggering

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and Push to GHCR
    # Edge prereleases also fire "release: published", and rebuilding here would
    # re-tag the stable :latest image from an unchanged stable config.
    if: ${{ github.event_name != 'release' || !startsWith(github.event.release.tag_name, 'edge-') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            platform: linux/amd64
            runs-on: ubuntu-latest
          - architecture: aarch64
            platform: linux/arm64
            runs-on: ubuntu-22.04-arm
    runs-on: ${{ matrix.runs-on }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Version from Config
        run: |
          VERSION=$(grep '^version:' sure/config.yaml | awk '{print $2}')
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        working-directory: sure
        run: |
          IMAGE_NAME=ghcr.io/${{ github.repository_owner }}/${{ matrix.architecture }}-sure-homeassistant

          docker buildx build \
            --platform ${{ matrix.platform }} \
            -t $IMAGE_NAME:${{ env.VERSION }} \
            -t $IMAGE_NAME:latest \
            --push .

      - name: Logout from GitHub Container Registry
        run: docker logout ghcr.io
