name: Update Sure Edge Version

on:
  schedule:
    - cron: "0 14 * * *" # Daily, 14:00 UTC
  workflow_dispatch: # Allows manual triggering

permissions:
  contents: write
  pull-requests: write

jobs:
  update-edge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Get latest Sure prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The mirror image of auto-update.yaml: that one excludes prereleases,
          # this one wants only them. gh has no --only-pre-releases flag, so
          # filter the list, which is already newest-first.
          LATEST=$(gh release list --repo we-promise/sure --exclude-drafts --limit 30 \
            --json tagName,isPrerelease --jq 'map(select(.isPrerelease)) | .[0].tagName // ""')
          LATEST=${LATEST#v}
          if [ -z "$LATEST" ]; then
            echo "Upstream published no prerelease in the last 30 releases" >&2
            exit 1
          fi
          echo "LATEST_VERSION=$LATEST" >> "$GITHUB_ENV"

      - name: Get current versions
        run: |
          # The addon version is "<addon_version>-<sure_version>", and a
          # prerelease carries its own dashes (0.7.5-alpha.8), so the Sure half
          # is everything after the first dash.
          CURRENT=$(grep -oP '(?<=^version: ).+' sure-edge/config.yaml | cut -d- -f2-)
          echo "CURRENT_VERSION=$CURRENT" >> "$GITHUB_ENV"
          ADDON_VERSION=$(grep -oP '(?<=^version: ).+' sure-edge/config.yaml | cut -d- -f1)
          echo "ADDON_VERSION=$ADDON_VERSION" >> "$GITHUB_ENV"

      - name: Compare versions
        run: |
          if [ "$LATEST_VERSION" != "$CURRENT_VERSION" ]; then
            echo "UPDATE_NEEDED=true" >> "$GITHUB_ENV"
          else
            echo "UPDATE_NEEDED=false" >> "$GITHUB_ENV"
          fi

      - name: Verify the image tag exists
        if: env.UPDATE_NEEDED == 'true'
        run: |
          TOKEN=$(curl -fsSL "https://ghcr.io/token?scope=repository%3Awe-promise%2Fsure%3Apull&service=ghcr.io" | jq -r '.token')
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json" \
            "https://ghcr.io/v2/we-promise/sure/manifests/${LATEST_VERSION}")
          if [ "$STATUS" != "200" ]; then
            echo "ghcr.io/we-promise/sure:${LATEST_VERSION} is not published yet (HTTP $STATUS)" >&2
            exit 1
          fi

      - name: Bump version in config.yaml
        if: env.UPDATE_NEEDED == 'true'
        run: |
          # Only config.yaml: the edge image is built from the sure/ context with
          # --build-arg SURE_VERSION, so this file is the single source of truth
          # for which Sure prerelease the edge addon ships.
          sed -i "s/^version: .*/version: ${ADDON_VERSION}-${LATEST_VERSION}/" sure-edge/config.yaml

      - name: Create or update Pull Request
        if: env.UPDATE_NEEDED == 'true'
        uses: peter-evans/create-pull-request@v7
        id: cpr
        with:
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          base: main
          branch: update-sure-edge-${{ env.LATEST_VERSION }}
          commit-message: "chore: update Sure Edge to ${{ env.LATEST_VERSION }}"
          title: "chore: Update Sure Edge to ${{ env.LATEST_VERSION }}"
          body: |
            Updates the **edge** addon to Sure **${{ env.LATEST_VERSION }}** (from ${{ env.CURRENT_VERSION }}).

            Release notes: https://github.com/we-promise/sure/releases/tag/v${{ env.LATEST_VERSION }}

            This is a prerelease and only affects the `sure-edge` addon. The stable `sure` addon is untouched.

            Check the release notes for new or removed environment variables before merging — the addon only exposes the options listed in `sure-edge/config.yaml`.
          labels: "automated update, prerelease"
          delete-branch: true
          draft: false
