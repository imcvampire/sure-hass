name: "Test Build"

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-build:
    name: Test Build
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            platform: linux/amd64
            runs-on: ubuntu-latest
          - architecture: aarch64
            platform: linux/arm64
            runs-on: ubuntu-22.04-arm
    runs-on: ${{ matrix.runs-on }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The addon version is "<addon_version>-<sure_version>" and nothing passes
      # --build-arg, so the Dockerfile default is what actually ships. Fail loudly
      # if a hand edit lets the two drift apart.
      - name: Check version consistency
        run: |
          SURE_VERSION=$(grep -oP '(?<=^ARG SURE_VERSION=).+' sure/Dockerfile)
          CONFIG_SURE_VERSION=$(grep -oP '(?<=^version: ).+' sure/config.yaml | cut -d- -f2-)
          if [ "$SURE_VERSION" != "$CONFIG_SURE_VERSION" ]; then
            echo "Dockerfile ships Sure $SURE_VERSION but config.yaml advertises $CONFIG_SURE_VERSION" >&2
            exit 1
          fi
          echo "Both pin Sure $SURE_VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (test only)
        working-directory: sure
        run: |
          docker buildx build \
            --platform ${{ matrix.platform }} \
            -f Dockerfile .

  test-build-edge:
    name: Test Build (edge)
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            platform: linux/amd64
            runs-on: ubuntu-latest
          - architecture: aarch64
            platform: linux/arm64
            runs-on: ubuntu-22.04-arm
    runs-on: ${{ matrix.runs-on }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Both addons can be installed on the same Home Assistant instance. Home
      # Assistant rejects a duplicate slug outright, and a shared host port would
      # stop the second addon from starting, so catch a careless copy-paste here.
      - name: Check the channels do not collide
        run: |
          status=0
          for field in slug image; do
            STABLE=$(grep -oP "(?<=^${field}: ).+" sure/config.yaml)
            EDGE=$(grep -oP "(?<=^${field}: ).+" sure-edge/config.yaml)
            if [ "$STABLE" = "$EDGE" ]; then
              echo "Both addons declare ${field}: $STABLE" >&2
              status=1
            fi
          done
          STABLE_PORT=$(grep -oP '(?<=^  3000/tcp: ).+' sure/config.yaml)
          EDGE_PORT=$(grep -oP '(?<=^  3000/tcp: ).+' sure-edge/config.yaml)
          if [ "$STABLE_PORT" = "$EDGE_PORT" ]; then
            echo "Both addons map host port $STABLE_PORT" >&2
            status=1
          fi
          exit $status

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # The edge addon has no Dockerfile of its own: it wraps the stable one with
      # a different Sure version, so config.yaml is the only source for it. This
      # build is also what proves the advertised prerelease image really exists.
      - name: Build Docker image (test only)
        working-directory: sure
        run: |
          VERSION=$(grep '^version:' ../sure-edge/config.yaml | awk '{print $2}')
          SURE_VERSION=${VERSION#*-}
          echo "Building edge $VERSION against Sure $SURE_VERSION"
          docker buildx build \
            --platform ${{ matrix.platform }} \
            --build-arg SURE_VERSION="$SURE_VERSION" \
            -f Dockerfile .
