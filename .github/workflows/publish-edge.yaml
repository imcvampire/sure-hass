name: "Publish Edge"
on:
  # Same reasoning as publish.yaml: Home Assistant reads sure-edge/config.yaml
  # straight from the default branch, so merging a version bump advertises the
  # update immediately and the image has to exist by then. The sure/ paths are
  # here because the edge image is built from that context -- a wrapper change
  # has to reach both channels.
  push:
    branches:
      - main
    paths:
      - "sure-edge/**"
      - "sure/Dockerfile"
      - "sure/run.sh"
  release:
    types: [published]
  workflow_dispatch: # Allows manual triggering

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-edge-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and Push Edge to GHCR
    # Stable releases also fire "release: published". Only rebuild edge for its
    # own tags.
    if: ${{ github.event_name != 'release' || startsWith(github.event.release.tag_name, 'edge-') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            platform: linux/amd64
            runs-on: ubuntu-latest
          - architecture: aarch64
            platform: linux/arm64
            runs-on: ubuntu-22.04-arm
    runs-on: ${{ matrix.runs-on }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Versions from Config
        run: |
          VERSION=$(grep '^version:' sure-edge/config.yaml | awk '{print $2}')
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          # "<addon_version>-<sure_version>"; the Sure half keeps the prerelease
          # dashes, so strip only up to the first one.
          echo "SURE_VERSION=${VERSION#*-}" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        # The sure/ context on purpose: the edge addon ships the same Dockerfile
        # and run.sh as the stable one, and differs only in the Sure version it
        # wraps. Forking those two files would let the channels drift.
        working-directory: sure
        run: |
          IMAGE_NAME=ghcr.io/${{ github.repository_owner }}/${{ matrix.architecture }}-sure-edge-homeassistant

          docker buildx build \
            --platform ${{ matrix.platform }} \
            --build-arg SURE_VERSION=${{ env.SURE_VERSION }} \
            -t $IMAGE_NAME:${{ env.VERSION }} \
            -t $IMAGE_NAME:edge \
            --push .

      - name: Logout from GitHub Container Registry
        run: docker logout ghcr.io
