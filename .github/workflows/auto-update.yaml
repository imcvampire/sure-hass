name: Update Sure Version

on:
  schedule:
    - cron: "0 14 * * 5" # Weekly, Friday 14:00 UTC
  workflow_dispatch: # Allows manual triggering

permissions:
  contents: write
  pull-requests: write

jobs:
  update-repo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Get latest stable Sure release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Skip prereleases: upstream tags those v*-alpha.* and publishes them
          # as the "latest" image tag, while "stable" tracks real releases.
          LATEST=$(gh release list --repo we-promise/sure --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName')
          LATEST=${LATEST#v}
          if [ -z "$LATEST" ]; then
            echo "Could not determine the latest Sure release" >&2
            exit 1
          fi
          echo "LATEST_VERSION=$LATEST" >> "$GITHUB_ENV"

      - name: Get current versions
        run: |
          CURRENT=$(grep -oP '(?<=^ARG SURE_VERSION=).+' sure/Dockerfile)
          echo "CURRENT_VERSION=$CURRENT" >> "$GITHUB_ENV"
          # The addon version is "<addon_version>-<sure_version>". Upstream bumps
          # only ever change the second half; the addon half stays as it is.
          ADDON_VERSION=$(grep -oP '(?<=^version: ).+' sure/config.yaml | cut -d- -f1)
          echo "ADDON_VERSION=$ADDON_VERSION" >> "$GITHUB_ENV"

      - name: Compare versions
        run: |
          if [ "$LATEST_VERSION" != "$CURRENT_VERSION" ]; then
            echo "UPDATE_NEEDED=true" >> "$GITHUB_ENV"
          else
            echo "UPDATE_NEEDED=false" >> "$GITHUB_ENV"
          fi

      - name: Verify the image tag exists
        if: env.UPDATE_NEEDED == 'true'
        run: |
          TOKEN=$(curl -fsSL "https://ghcr.io/token?scope=repository%3Awe-promise%2Fsure%3Apull&service=ghcr.io" | jq -r '.token')
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json" \
            "https://ghcr.io/v2/we-promise/sure/manifests/${LATEST_VERSION}")
          if [ "$STATUS" != "200" ]; then
            echo "ghcr.io/we-promise/sure:${LATEST_VERSION} is not published yet (HTTP $STATUS)" >&2
            exit 1
          fi

      - name: Bump version in Dockerfile and config.yaml
        if: env.UPDATE_NEEDED == 'true'
        run: |
          sed -i "s/^ARG SURE_VERSION=.*/ARG SURE_VERSION=${LATEST_VERSION}/" sure/Dockerfile
          sed -i "s/^version: .*/version: ${ADDON_VERSION}-${LATEST_VERSION}/" sure/config.yaml

      - name: Create or update Pull Request
        if: env.UPDATE_NEEDED == 'true'
        uses: peter-evans/create-pull-request@v7
        id: cpr
        with:
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          base: main
          branch: update-sure-${{ env.LATEST_VERSION }}
          commit-message: "chore: update Sure to ${{ env.LATEST_VERSION }}"
          title: "chore: Update Sure to ${{ env.LATEST_VERSION }}"
          body: |
            Updates the addon to Sure **${{ env.LATEST_VERSION }}** (from ${{ env.CURRENT_VERSION }}).

            Release notes: https://github.com/we-promise/sure/releases/tag/v${{ env.LATEST_VERSION }}

            Check the release notes for new or removed environment variables before merging — the addon only exposes the options listed in `sure/config.yaml`.
          labels: "automated update"
          delete-branch: true
          draft: false
