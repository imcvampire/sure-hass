name: Sure (Finances) Edge
description: >-
  Prerelease channel for the Sure addon. Tracks upstream Sure alpha builds so you
  can test them before they reach the stable addon. Not for your real finances.
slug: sure-edge
init: false
arch:
  - aarch64
  - amd64
startup: application
boot: auto
#ingress: true
#ingress_port: 3000
webui: "[PROTO:rails_force_ssl]://[HOST]:[PORT:3000]"
url: https://github.com/imcvampire/sure-hass
# 1235, not the stable addon's 1234: both addons can be installed at once and
# would otherwise fight over the same host port.
ports:
  3000/tcp: 1235
map:
  - "data:rw"
schema:
  postgres_user: str?
  postgres_password: str
  postgres_db: str?
  secret_key_base: str
  db_host: str?
  db_port: str?
  redis_url: str?
  plaid_client_id: str?
  plaid_secret: str?
  plaid_env: str?
  self_hosted: bool
  rails_force_ssl: bool
  rails_assume_ssl: bool
  onboarding_state: list(open|invite_only|closed)
  openai_access_token: str?
  # Escape hatch for anything Sure reads that this addon has no option for.
  # A list of dicts is "required" to the Supervisor -- unlike ["str?"], it has no
  # per-entry optional marker -- so the empty default below has to stay.
  env_vars:
    - name: str
      value: str
options:
  postgres_user: "postgres"
  postgres_password: "homeassistant"
  # Deliberately not the stable addon's database. Alpha builds run unreleased
  # migrations on boot, and those are not designed to be rolled back.
  postgres_db: "sure_edge"
  secret_key_base: "generate_a_secure_key_here"
  db_host: "172.30.32.1"
  db_port: "5432"
  redis_url: "redis://3b88f413-redis:6379"
  self_hosted: true
  rails_force_ssl: false
  rails_assume_ssl: false
  onboarding_state: "open"
  env_vars: []
version: 0.7.0-0.7.5-alpha.11
image: ghcr.io/imcvampire/{arch}-sure-edge-homeassistant
